<head>

<style>
:root{--bg:#f7f8f6;--card:#fff;--ink:#1d2624;--mute:#5d6b67;--line:#dfe5e2;--acc:#2f6f62;--acc-soft:#e3efeb;--msg:#f1f5f3;--mark:#fff1b8;--hot:#c2410c;--warm:#b7791f;--cool:#3b6ea5;--off:#8a8f8d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141918;--card:#1c2321;--ink:#e6ecea;--mute:#9aa8a4;--line:#2c3532;--acc:#6fbfa9;--acc-soft:#1f302b;--msg:#232c29;--mark:#5a4b12;--hot:#f08a5d;--warm:#e0b04f;--cool:#7fa8d8;--off:#7c8381}}
:root[data-theme="dark"]{--bg:#141918;--card:#1c2321;--ink:#e6ecea;--mute:#9aa8a4;--line:#2c3532;--acc:#6fbfa9;--acc-soft:#1f302b;--msg:#232c29;--mark:#5a4b12;--hot:#f08a5d;--warm:#e0b04f;--cool:#7fa8d8;--off:#7c8381}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}

nav{display:flex;gap:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--line)}

.panel{display:none;padding-top:14px}.panel.on{display:block}
.intro{background:var(--acc-soft);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.intro p{margin:4px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}

.msg{background:var(--msg);border-radius:10px;padding:9px 12px;margin:6px 0;display:flex;gap:10px;align-items:flex-start;white-space:pre-wrap}
.msg span{flex:1}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.cp{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:12px;padding:3px 8px;border-radius:6px;cursor:pointer}
.cp.ok{color:var(--acc);border-color:var(--acc)}
.note{font-size:14px;color:var(--mute);border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:8px 0}
.warn{border-left-color:var(--hot)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14px}
select{font:inherit;font-size:14px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.stepper{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 12px}
.stepper button{border:1px solid var(--acc);background:var(--card);color:var(--acc);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px}
.stepper button:disabled{opacity:.35;cursor:default}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.steps button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:6px;font-size:13px;padding:4px 8px;cursor:pointer}
.steps button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
h2{font-size:19px;margin:0 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:16px;font-size:13px;cursor:pointer}
.chips button.on{border-color:var(--acc);background:var(--acc-soft)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
td,th{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.link{color:var(--acc);text-decoration:underline;cursor:pointer;background:none;border:none;font:inherit;padding:0}
button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

<script>
const TABS=[
{id:"base",name:"База (10)"},
{id:"script",name:"Скрипт по шагам"},
{id:"obj",name:"Возражения"},
{id:"prod",name:"Продукты и цены"}

/* ---------- БАЗА ---------- */
const BASE_INTRO=`<p><b>Порядок:</b> не обязательно писать всем сразу. Например, половине сегодня, половине завтра, чтобы успевать отвечать каждому.</p>
<p><b>Отвечай быстро.</b> Если сейчас не можешь ответить, напиши коротко: «Привет! Сейчас выйду с тренировки и отвечу тебе 😊». Так человек не остынет и не потеряется.</p>
<p><b>Если в ступоре</b> и навигатор не помогает, кидай мне скрины переписки, помогу с ответом.</p>
<p>Сначала отправляешь только первое сообщение и ждёшь ответа. После ответа — сообщения 2, 3 (с картинкой) и 4, каждое отдельно.</p>
<p>Если с человеком была на «вы», переделай на «вы». Пишем от себя лично, не от лица DDX.</p>
<p><b>Табличка.</b> Кому написала и что ответили, желательно отмечать в табличке с базой. Её я тебе скину отдельно.</p>`;
const BASE=[
{id:"snezhana",t:"Снежана",tag:["🔥 Писать первой","p1"],
why:"Самая горячая. Тренировалась долго, оставила отзыв и фото. Ушла из-за покупки квартиры, сама звала тренировать её онлайн. Непонятно, какой онлайн ей нужен — это и выясняем.",
parts:[{h:"1. Первое сообщение",m:["Снежана, привет! Ну что, как твои дела, как новая квартира, обжилась?)"]},{n:"Ждём ответа. Дальше — сообщения 2, 3 и 4."},{h:"2. После ответа",m:["Помню, как ты звала меня к себе тренировать, и тут у меня родилась новая классная услуга) Я запустила онлайн-ведение!\n\nСоставляю программу под тебя, ты присылаешь видео подходов, я правлю технику, каждый день смотрю твоё питание (тарелочки)\n\nСделала очень доступно по цене, как 4 тренировки в зале, только я с тобой весь месяц)"]},{h:"3. Картинка с форматами",m:["Вот тут расписала подробнее:"]},{n:"Сразу к этому сообщению прикрепи картинку с форматами и ценами."},{h:"4. Вопрос",m:["Скажи, ты сейчас занимаешься в целом? Как идёт?)"]},
{h:"Куда вести дальше",n:"Если тренируется сама → предлагай пробную неделю (шаг 6 скрипта). Если хочет заниматься с тобой вживую → живые онлайн-тренировки по той же цене, что в зале: 4 — 15 000 ₽, 8 — 28 000 ₽, 12 — 38 400 ₽. Она твоя первая онлайн-клиентка: через пару недель попроси короткий отзыв уже про онлайн."}]},
{id:"natalia2",t:"Наталья (≈50, недавно на ознакомительной)",tag:["🔥 Тёплая","p1"],
why:"Пришла сама выбрать тренера, ознакомительная понравилась, получила цены и правила в Telegram. Сказала «уеду, вернусь — напишу» и пропала ~3 недели. Лишний вес, усталость, хочет подтянуть тело. Знакомы час — на «вы».",
parts:[{h:"1. Первое сообщение",m:["Наталья, добрый день! Это Татьяна, тренер, мы с вами занимались на ознакомительной тренировке)\n\nВы уже вернулись из поездки? Как отдохнули?)"]},{n:"Ждём ответа. Дальше — сообщения 2, 3 и 4."},{h:"2. После ответа",m:["Хотела поделиться: у меня теперь есть онлайн-формат ведения: программа тренировок под вас, проверка техники по видео и питание со мной на связи каждый день)"]},{h:"3. Картинка с форматами",m:["Вот тут расписала подробнее:"]},{n:"Сразу к этому сообщению прикрепи картинку с форматами и ценами."},{h:"4. Вопрос",m:["Как у вас сейчас с тренировками? Получается двигаться или пока на паузе?"]},
{h:"Куда вести дальше",n:"Её «подумаю» после ознакомительной — это ложное возражение. Если ответит, спокойно выясни, что тогда остановило (возражение 7). Если в Москве — можно и в зал, и онлайн-питание."}]},
{id:"bibigul",t:"Бибигуль",tag:["Тёплая","p2"],
why:"23–24 года, денег немного. Пришла «поставить технику и уйти», но взяла ещё блок: раскрылась спина, понравился подход к питанию. Ушла из-за денег и потому что ближе другой клуб DDX. Ставит сердечки на истории в Telegram, расстались хорошо.",
parts:[{h:"1. Первое сообщение",m:["Бибигуль, привет! Это Таня, спасибо за сердечки в историях, каждый раз приятно!)\n\nКак ты? Получилось вернуться к тренировкам?"]},{n:"Ждём ответа. Дальше — сообщения 2, 3 и 4."},{h:"2. После ответа",m:["Пишу с крутой новостью: я запустила онлайн-ведение! Ты можешь тренироваться в своём клубе рядом с домом, а я веду тебя удалённо: программа, проверка техники по видео и питание."]},{h:"3. Картинка с форматами",m:["Вот тут расписала подробнее:"]},{n:"Сразу к этому сообщению прикрепи картинку с форматами и ценами."},{h:"4. Вопрос",m:["Помню, как у тебя тогда раскрылась спина, будет обидно это потерять.. Ты сейчас тренируешься сама?"]},
{h:"Куда вести дальше",n:"Деньги — главный стоп. Когда дойдёт до цены, сначала пробная неделя за 3 900 ₽ с зачётом в месяц. Если совсем нет — бесплатный мини-разбор и напоминание через месяц."}]},
{id:"marina",t:"Марина",tag:["Тёплая","p2"],
why:"30+, репетитор английского и японского. Хотела поставить технику и заниматься сама — ты прописывала ей самостоятельные дни. Запрос: подтянуть тело, живот, быть активной, интересовалась питанием. Оставила отзыв. Не видела 2–3 месяца.",
parts:[{h:"1. Первое сообщение",m:["Марина, привет! Это Таня Баженова, тренер)\nДавно тебя не видела в зале, как ты?\nПродолжаешь тренироваться по программе, которую мы составляли?"]},{n:"Ждём ответа. Дальше — сообщения 2, 3 и 4."},{h:"2. После ответа",m:["Я к тебе с классной новостью: запустила онлайн-ведение сейчас как раз для тех, кто хочет тренироваться самостоятельно)\n\nПрограмма тренировок под тебя, я проверяю технику по видео и помогаю с питанием\nТы, кстати, спрашивала вроде у меня про такой вариант)"]},{h:"3. Картинка с форматами",m:["Вот тут расписала подробнее:"]},{n:"Сразу к этому сообщению прикрепи картинку с форматами и ценами."},{h:"4. Вопрос",m:["Как у тебя сейчас с животом и питанием, получается?"]},
{h:"Куда вести дальше",n:"Самостоятельная — значит, главное возражение будет «я и так сама». Смотри возражение 3. Аргумент: программа уже есть, не хватает проверки техники и питания."}]},
{id:"veronika",t:"Вероника",tag:["Средний приоритет","p3"],
why:"24 года, сколиоз сложной стадии, поправилась. Похудела, выстроили питание. Но часто опаздывала и переносила, коммуникация тяжёлая. Последнее сообщение прочитала и не ответила. Отзыв в DDX оставляла.",
parts:[{h:"1. Первое сообщение",m:["Вероника, привет! Это Таня) Вспоминала, как хорошо у тебя тогда пошло с весом и питанием) Как ты сейчас, как спина?"]},{n:"Ждём ответа. Дальше — сообщения 2, 3 и 4."},{h:"2. После ответа",m:["Я к тебе с классной новостью: запустила сейчас онлайн-ведение\n\nФормат, мне кажется, тебе понравится - не нужно будет подстраиваться под расписание, тренируешься, когда тебе комфортно, сама по моей программе. Веду тебя и по питанию тоже)"]},{h:"3. Картинка с форматами",m:["Вот тут расписала подробнее:"]},{n:"Сразу к этому сообщению прикрепи картинку с форматами и ценами."},{h:"4. Вопрос",m:["Как у тебя сейчас со временем и самочувствием?"]},
{h:"Куда вести дальше",n:"Сразу проговори правила ведения: каждый день тарелки, видео тренировок. Если не готова к регулярным отчётам — лучше не брать, чтобы не повторилась история с переносами."}]},
{id:"alex48",t:"Александр (48)",tag:["Средний приоритет","p3"],
why:"Ведущий мероприятий, важна форма. Хочет экономить, ходит рывками: на позитиве начинает, без поддержки сливается, в зале всё раздражает. Дотошный, мотивирован, когда понимает, что делать. Оставлял отзыв.",
parts:[{h:"1. Первое сообщение",m:["Александр, привет! Это Таня, тренер)\nДавно не видела тебя в зале! Помню, как у тебя всё отлично получалось, когда было чётко понятно, что и как делать) Как ты сейчас, занимаешься?"]},{n:"Ждём ответа. Дальше — сообщения 2, 3 и 4."},{h:"2. После ответа",m:["Я к тебе с классной новостью: запустила сейчас онлайн-ведение - составляю под тебя программу с подробными объяснениями по технике, ты присылаешь видео подходов по желанию, я поправляю + я на связи каждый день, так что тренироваться одному не придётся)"]},{h:"3. Картинка с форматами",m:["Вот тут расписала подробнее:"]},{n:"Сразу к этому сообщению прикрепи картинку с форматами и ценами."},{h:"4. Вопрос",m:["Как у тебя сейчас с тренировками, получается ходить?"]},
{h:"Куда вести дальше",n:"Ему важны детали — давай структуру и цифры (психотип «аналитик»).",w:"Ты говорила, что мужчин в онлайн брать не хочешь. Решай сама, писать или нет, но я бы написала: запрос у него как раз под онлайн-ведение."}]},
{id:"natalia1",t:"Наталья (51, WhatsApp)",tag:["Низкий приоритет","p4"],
why:"Похудела, полюбила белок, «в зал меня приводят только деньги». Тяжело принимает нагрузку, любит сервис, опаздывала, свела до 1 раза в неделю. Живёт на две страны, уехала в Испанию и не объявилась. Коннекта у тебя с ней особо не было.",
parts:[{h:"1. Первое сообщение",m:["Наталья, добрый день! Это Татьяна, тренер) Как вы, уже вернулись из Испании?"]},{n:"Ждём ответа. Дальше — сообщения 2, 3 и 4."},{h:"2. После ответа",m:["Я тут вспоминала, как вам понравилось питаться с белком и сколько энергии это давало) Теперь я веду и онлайн!\n\nМожно тренироваться по моей программе в любом месте, я проверяю технику по видео и каждый день смотрю питание)"]},{h:"3. Картинка с форматами",m:["Вот тут расписала подробнее:"]},{n:"Сразу к этому сообщению прикрепи картинку с форматами и ценами."},{h:"4. Вопрос",m:["Как у вас сейчас дела, получается держать питание?"]},
{h:"Куда вести дальше",n:"Ей ценен сервис и контроль: «я каждый день на связи» — главный аргумент.",w:"Пиши, только если готова её вести: твой комфорт тоже важен."}]},
{id:"alex30",t:"Александр (≈30)",tag:["Низкий приоритет","p4"],
why:"Полный, хочет скинуть вес, упёртый и стабильный, но прижимистый. Хотел за один блок взять максимум, сверял всё с нейросетью, снимал упражнения без спроса. В общении сложный. Не видела 1,5–2 месяца.",
parts:[{h:"1. Первое сообщение",m:["Александр, привет! Это Таня) Как ты, продолжаешь тренироваться?"]},{n:"Ждём ответа. Дальше — сообщения 2, 3 и 4."},{h:"2. После ответа",m:["Пишу с классной новостью: я запустила онлайн-ведение. Программа под твою цель, проверка техники по видео и питание под снижение веса, всё удалённо)\n\nСпециально сделала очень доступно и выгоднее, чем персональные тренировки - месяц работы как 4 тренировки в зале!"]},{h:"3. Картинка с форматами",m:["Вот тут подробнее расписала:"]},{n:"Сразу к этому сообщению прикрепи картинку с форматами и ценами."},{h:"4. Вопрос",m:["Как у тебя сейчас с весом, двигается?"]},
{h:"Куда вести дальше",n:"Если возьмёт — сразу правила: что присылает, как часто, без самовольной съёмки и пересылки материалов.",w:"Тот же момент про мужчин в онлайне: решай сама. Если возьмёшь, сразу обозначь правила."}]},
{id:"irina",t:"Ирина",tag:["Низкий приоритет","p4"],
why:"24 года, лишний вес, хочет похудеть и набрать тонус. Большое психологическое сопротивление, работает со специалистом. Продержалась месяц, уехала, потом переезд и просела по деньгам. Очень тёплая к тебе.",
parts:[{h:"1. Первое сообщение",m:["Ира, привет! Это Таня. Как ты, как переезд?"]},{n:"Ждём ответа. Дальше — сообщения 2, 3 и 4."},{h:"2. После ответа",m:["Пишу с классной новостью: я запустила онлайн-ведение, теперь со мной можно тренироваться из любого города в комфортном темпе!)\n\nЯ подстраиваю программу под твоё состояние и всегда на связи)"]},{h:"3. Картинка с форматами",m:["Тут подробнее по формату расписала:"]},{n:"Сразу к этому сообщению прикрепи картинку с форматами и ценами."},{h:"4. Вопрос",m:["Как ты сейчас, получается двигаться?"]},

{t:"Писала, спрашивала, но не дошла",parts:[{m:["[Имя], привет! Это Таня Баженова 😊 Ты как-то писала мне про [запрос], и мы так и не встретились.","Как в итоге, получилось этим заняться?","Я запустила онлайн-ведение, теперь со мной можно работать из дома и в своём графике. Если тема ещё актуальна, расскажу, как это устроено. Актуально?"]}]},

{t:"Текущая офлайн-клиентка (если решили)",parts:[{m:["[Имя], кстати 😊 Ты говорила, что [уезжаешь / хочешь подтянуть питание]. Я теперь веду и онлайн: могу на это время дать программу и каждый день смотреть твои тарелки, чтобы форма не откатилась. Как тебе?"]}]}]},

{t:"Спина и осанка",open:true,parts:[{m:["Ты сказала, что [к вечеру тяжело держать спину и плечи уходят вперёд]. Это то, с чем ко мне приходят чаще всего, и у меня есть профильное обучение по реабилитации спины и осанки.","Предлагаю начать с пробной недели. Сначала разберём твои ограничения и цель, я дам программу на 2 тренировки под твою задачу. Ты тренируешься сама и присылаешь видео, я правлю технику, чтобы работала спина, а не терпела поясница. Все 7 дней смотрю твои тарелки. В конце недели запишу голосовое: что видим и куда идём дальше.","Неделя стоит 3 900 ₽. Если продолжаем, она засчитывается в месяц, и ты доплачиваешь 11 100 ₽. Стартуем с понедельника или тебе удобнее со среды?"]}]},

/* ---------- ПРОДУКТЫ ---------- */
const PROD=`<div class="intro"><p>Все форматы и цены в одном месте. Для переписки есть картинка с прайсом: отправляй её после того, как назвала цену текстом.</p></div>
<div class="tbl"><table><tr><th>Что</th><th>Цена</th><th>Что внутри</th></tr>
<tr><td>Мини-разбор</td><td>бесплатно</td><td>Человек пишет «Анкета» → ты присылаешь короткие вопросы про тело, питание и здоровье → по ответам даёшь конкретный план на ближайшие 3 месяца (удобно голосовым)</td></tr>
<tr><td>Пробная неделя</td><td>3 900 ₽</td><td>Разбор целей и ограничений, программа на 2 тренировки под задачу, разбор техники по видео, 7 дней контроля питания (фото тарелок и обратная связь), в конце голосовое с итогами и планом на месяц. Засчитывается в месяц: доплата 11 100 ₽</td></tr>
<tr><td>Онлайн-ведение</td><td>15 000 ₽ / мес</td><td>Индивидуальная программа: 2 тренировки в неделю под график, проверка техники по видео, ежедневный контроль питания (фото тарелок + скрин FatSecret), расчёт КБЖУ под цель, связь в чате каждый день. Консультация по питанию в подарок (отдельно 7 000 ₽)</td></tr>
<tr><td>Живые онлайн-тренировки</td><td>4 — 15 000 ₽<br>8 — 28 000 ₽<br>12 — 38 400 ₽</td><td>Тренировки по видеосвязи в реальном времени. Цена как в зале: по времени это то же самое</td></tr>
<tr><td>Консультация по питанию</td><td>7 000 ₽</td><td>Отдельно, для тех, кому нужно только питание: созвон около часа, аудит питания, продуктовая корзина, расчёт КБЖУ под цель</td></tr>
</table></div>
<p class="note">Оплата: перевод по номеру, чек через «Мой налог».</p>
<p class="note">Сильный аргумент для бывших клиенток: 15 000 ₽ — это цена 4 тренировок в зале. Онлайн за те же деньги — весь месяц на связи каждый день.</p>
`;

/* ---------- РЕНДЕР ---------- */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const hl=s=>esc(s).replace(/\[([^\]]+)\]/g,"<mark>[$1]</mark>");
function msgs(arr){return arr.map(t=>`<div class="msg"><span>${hl(t)}</span><button class="cp" data-t="${esc(t).replace(/"/g,"&quot;")}">Копировать</button></div>`).join("")+(arr.length>1?`<button class="cp" data-t="${esc(arr.join("\n\n")).replace(/"/g,"&quot;")}">Копировать все</button>`:"")}
function part(p){return `<div class="part">${p.h?`<h4>${esc(p.h)}</h4>`:""}${p.m?msgs(p.m):""}${p.n?`<p class="note">${esc(p.n)}</p>`:""}${p.w?`<p class="note warn">⚠️ ${esc(p.w)}</p>`:""}</div>`}
function card(c,extra=""){return `<details${c.open?" open":""}><summary>${esc(c.t)}${c.tag?` <span class="tag ${c.tag[1]}">${c.tag[0]}</span>`:""}</summary><div class="body">${c.why?`<p class="why">${esc(c.why)}</p>`:""}${c.parts.map(part).join("")}${extra}</div></details>`}

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function baseHTML(){return `<div class="intro">${BASE_INTRO}</div>`+BASE.map(c=>card(c)).join("")}

let step=0;
function scriptHTML(){const s=STEPS[step];
return `<div class="steps">${STEPS.map((x,i)=>`<button data-step="${i}" class="${i===step?"on":""}">${i+1}. ${esc(x.t)}</button>`).join("")}</div>
<h2>${step+1}. ${esc(s.t)}</h2><p class="sub">${esc(s.d)}</p>
${s.cards.map(c=>card(c)).join("")}
${s.link?`<p><button class="link" data-go="obj">Открыть все возражения</button></p>`:""}
<div class="stepper"><button data-nav="-1" ${step===0?"disabled":""}>Назад</button><span class="sub" style="margin:0">${step+1} из ${STEPS.length}</span><button data-nav="1" ${step===STEPS.length-1?"disabled":""}>Дальше</button></div>`}

let filt="Все";
function objHTML(){const cats=["Все",...new Set(OBJ.map(o=>o.c))];
return `<div class="intro"><p><b>Схема:</b> присоединиться → уточнить настоящую причину → аргумент → следующий шаг.</p><p>Минимум две попытки. После второй «нет» — красивый выход (шаг «Отказ»).</p></div>
<div class="chips">${cats.map(c=>`<button data-f="${c}" class="${c===filt?"on":""}">${c}</button>`).join("")}</div>`+
OBJ.filter(o=>filt==="Все"||o.c===filt).map(o=>card({t:o.t,tag:[o.c,"p3"],why:o.why,parts:o.parts})).join("")}

function render(id){
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===id));
document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p_"+id));
const el=document.getElementById("p_"+id);
el.innerHTML=id==="base"?baseHTML():id==="script"?scriptHTML():id==="obj"?objHTML():PROD;
store("tb_tab",id);}

document.getElementById("nav").innerHTML=TABS.map(t=>`<button data-tab="${t.id}">${t.name}</button>`).join("");
document.getElementById("panels").innerHTML=TABS.map(t=>`<div class="panel" id="p_${t.id}"></div>`).join("");

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.tab){render(b.dataset.tab);return}
if(b.dataset.go){render(b.dataset.go);window.scrollTo(0,0);return}
if(b.dataset.step!==undefined){step=+b.dataset.step;render("script");return}
if(b.dataset.nav){step=Math.max(0,Math.min(STEPS.length-1,step+ +b.dataset.nav));render("script");window.scrollTo(0,0);return}
if(b.dataset.f){filt=b.dataset.f;render("obj");return}
if(b.classList.contains("cp")){const t=b.dataset.t.replace(/&quot;/g,'"').replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
const done=()=>{const o=b.textContent;b.textContent="Скопировано";b.classList.add("ok");setTimeout(()=>{b.textContent=o;b.classList.remove("ok")},1200)};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallback(t,done))}else fallback(t,done);}
});
function fallback(t,done){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){}a.remove()}

render(store("tb_tab")||"base");
</script>
</body>
</html>
